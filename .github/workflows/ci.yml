name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks-history scans every commit, so fetch the full history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install pre-commit
        run: pipx install pre-commit
      - name: Lint
        run: make lint
